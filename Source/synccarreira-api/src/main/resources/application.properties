spring.application.name=synccarreira-api

spring.profiles.active=${APP_PROFILE:dev}

spring.jpa.open-in-view=false

security.client-id=${CLIENT_ID:synccarreira-front-id}
security.client-secret=${CLIENT_SECRET:synccarreira-project-2026}

security.jwt.duration=${JWT_DURATION:18000}

cors.origins=${CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

email.password-recover.token.minutes=${PASSWORD_RECOVER_TOKEN_MINUTES:1440}
email.password-recover.uri=${PASSWORD_RECOVER_URI:http://localhost:5173/new-password?token=}